services:
  web:
    image: oven/bun:1
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      # Vite >= 6.1 appends this to its allowed hosts so the preview's external
      # hostname is accepted for dev assets / HMR.
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: ${__VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS:-}
      BASE44_PUBLIC_HOST_SUFFIX: ${BASE44_PUBLIC_HOST_SUFFIX:-}
    command: sh -c "bun install --frozen-lockfile && bun run dev -- --host 0.0.0.0 --port 3000 --strictPort"
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://localhost:3000/');if(!r.ok)process.exit(1)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

volumes:
  node_modules:
